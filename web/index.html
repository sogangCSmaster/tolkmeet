<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 첫 화면이 깜박이지 않게 테마·자막 크기를 CSS보다 먼저 적용한다(값은 lib/theme.ts가 저장). -->
    <script>try{var d=document.documentElement,t=localStorage.getItem('tolkmeet.theme');if(t==='light'||t==='dark')d.dataset.theme=t;var z={s:'0.875',l:'1.2'}[localStorage.getItem('tolkmeet.captionSize')];if(z)d.style.setProperty('--caption-scale',z)}catch(e){}</script>
    <title>Tolkmeet</title>
    <!-- 앱 주소(회의·초대·로그인 링크)는 검색에 올리지 않는다. 검색은 소개 페이지(tolkmeet.com)가 맡는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 메신저·메일에 회의 초대 링크를 붙였을 때의 미리보기. 링크마다 언어를 알 수 없어 영어 한 벌. -->
    <meta name="description" content="Video meetings where what you say appears as captions in each listener’s language as you speak." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tolkmeet" />
    <meta property="og:title" content="Tolkmeet" />
    <meta property="og:description" content="Video meetings where what you say appears as captions in each listener’s language as you speak." />
    <meta property="og:image" content="https://tolkmeet.com/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 파비콘: 최신 브라우저는 SVG, 그 밖은 ico(16·32·48), iOS 홈 화면은 apple-touch-icon, 안드로이드는 매니페스트. 첫 화면 요청은 그대로 1개(SVG). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#16181D" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Pretendard JP는 한글·일본어·라틴을 모두 포함한다. dynamic subset이라 화면에 쓰인 글자 범위의 조각만 내려받는다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
